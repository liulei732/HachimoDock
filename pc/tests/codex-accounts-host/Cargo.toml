[package]
name = "hachimodock-codex-accounts-tests"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
path = "lib.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
chrono = "0.4"
tempfile = "3.27.0"
libc = "0.2"
url = "2.5"
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json", "native-tls", "system-proxy", "gzip"] }
[profile.dev]
debug = 0
incremental = false
